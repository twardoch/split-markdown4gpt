site_name: split-markdown4gpt
site_description: Split large Markdown files into token-bounded chunks for LLM context windows
site_author: Adam Twardoch
site_url: https://twardoch.github.io/split-markdown4gpt/
repo_url: https://github.com/twardoch/split-markdown4gpt
repo_name: twardoch/split-markdown4gpt
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_bases: true

nav:
  - Home: index.md
  - Why Splitting Matters: why-splitting.md
  - Usage: usage.md
  - API Reference: api.md
  - Changelog: changelog.md
